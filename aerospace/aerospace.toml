config-version = 2
start-at-login = true
auto-reload-config = false
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

on-window-detected = [
    { check-further-callbacks = true, run = 'layout floating' },

    {
        if = 'test %{app-bundle-id} = com.mitchellh.ghostty',
        run = 'move-node-to-workspace 1',
    },

    {
        if = 'test %{app-bundle-id} = org.mozilla.firefox',
        run = 'move-node-to-workspace 2',
    },

    {
        if = 'test %{app-bundle-id} = com.usebruno.app',
        run = 'move-node-to-workspace 3',
    },

    {
        if = 'test %{app-bundle-id} = ru.keepcoder.Telegram',
        run = 'move-node-to-workspace 4',
    },

    {
        if = 'test %{app-bundle-id} = com.electron.dockerdesktop',
        run = 'move-node-to-workspace 6',
    },

    {
        if = 'test %{app-bundle-id} = com.apple.AppStore',
        run = 'move-node-to-workspace 7',
    },

    {
        if = 'test %{app-bundle-id} = com.apple.finder',
        run = 'move-node-to-workspace 8',
    },

    {
        if = 'test %{app-bundle-id} = com.apple.systempreferences',
        run = 'move-node-to-workspace 9',
    },
]

[mode.main.binding]
    ctrl-1 = 'workspace 1'
    ctrl-2 = 'workspace 2'
    ctrl-3 = 'workspace 3'
    ctrl-4 = 'workspace 4'
    ctrl-5 = 'workspace 5'
    ctrl-6 = 'workspace 6'
    ctrl-7 = 'workspace 7'
    ctrl-8 = 'workspace 8'
    ctrl-9 = 'workspace 9'

    ctrl-shift-1 = 'move-node-to-workspace 1'
    ctrl-shift-2 = 'move-node-to-workspace 2'
    ctrl-shift-3 = 'move-node-to-workspace 3'
    ctrl-shift-4 = 'move-node-to-workspace 4'
    ctrl-shift-5 = 'move-node-to-workspace 5'
    ctrl-shift-6 = 'move-node-to-workspace 6'
    ctrl-shift-7 = 'move-node-to-workspace 7'
    ctrl-shift-8 = 'move-node-to-workspace 8'
    ctrl-shift-9 = 'move-node-to-workspace 9'
